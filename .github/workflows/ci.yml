name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21 runs Gradle itself. The :domain module asks for a JDK 11 toolchain, which the
      # foojay resolver in settings.gradle.kts provisions on demand.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Built to prove it still packages, not kept: APKs are published by the release workflow.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      # Reports are only interesting when something broke, and that is when the logs alone are
      # rarely enough to tell why.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
