name: Release

on:
  push:
    tags: [ 'v*' ]

# Needed to create the release and attach the APKs to it.
permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APKs
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without the secret the build signs the release with the debug key, which still installs.
      # See app/build.gradle.kts.
      - name: Decode signing keystore
        if: env.RELEASE_KEYSTORE != ''
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A tag that fails its own tests should not become a release.
      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Name the APKs after the tag
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/DummyJsonPreview-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/DummyJsonPreview-${GITHUB_REF_NAME}-release.apk"
          ls -l artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*.apk
